name: Build TLM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK 25
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.0.8775105" "build-tools;35.0.0" "platforms;android-35" 2>&1 | tail -5
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.0.8775105" >> "$GITHUB_ENV"

      - name: Build libcore (Go → aar)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          # 必须走 ./run lib core —— 它会先 clone sing-box / libneko 到父目录，
          # go.mod 里的 replace ../../sing-box 才找得到
          ./run lib core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          chmod +x gradlew
          # 仓库里的 gradle.properties 是给小内存服务器用的（768m），
          # CI 有 16GB，放开限制，否则 Kotlin 编译会 Metaspace OOM
          sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8|' gradle.properties
          sed -i 's|^kotlin.compiler.execution.strategy=.*|kotlin.compiler.execution.strategy=daemon|' gradle.properties
          sed -i 's|^org.gradle.parallel=.*|org.gradle.parallel=true|' gradle.properties
          sed -i 's|^org.gradle.workers.max=.*|org.gradle.workers.max=4|' gradle.properties
          grep -E "jvmargs|strategy|parallel|workers" gradle.properties
          ./gradlew assembleFdroidRelease --console=plain \
            -x lint -x lintVitalAnalyzeFdroidRelease

      - name: Show artifacts
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Push APK to server (auto sign)
        run: |
          APK=$(find app/build/outputs/apk/fdroid/release -name "*arm64*.apk" | head -1)
          echo "uploading $APK ($(stat -c%s "$APK") bytes)"
          curl -sS --max-time 300 -X POST \
            "https://43-108-107-175.sslip.io:8080/upload-apk" \
            -H "X-Dev-Key: lcs-dev-7f3a91c4e2b8" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$APK" \
            -w "\nHTTP %{http_code}\n"

      - uses: actions/upload-artifact@v4
        with:
          name: tlm-apk
          path: app/build/outputs/apk/fdroid/release/*.apk
          retention-days: 7
