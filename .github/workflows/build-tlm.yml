name: Build TLM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK 25
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.0.8775105" "build-tools;35.0.0" "platforms;android-35" 2>&1 | tail -5
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.0.8775105" >> "$GITHUB_ENV"

      - name: Build libcore (Go → aar)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd libcore
          bash init.sh
          bash build.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon --console=plain \
            -x lint -x lintVitalAnalyzeFdroidRelease
        env:
          GRADLE_OPTS: -Xmx4g

      - name: Show artifacts
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: tlm-apk
          path: app/build/outputs/apk/fdroid/release/*.apk
          retention-days: 7
